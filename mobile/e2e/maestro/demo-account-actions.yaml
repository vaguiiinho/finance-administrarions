appId: br.com.finance.app
---
# CA44/CA46/CA48 + ADR 0013 (CA12, CA30): entra pelo alias "demo", a conta ja vem com dados de exemplo, tem todas as acoes e ve
# "Trocar senha" desabilitado com motivo (B8) e o aviso de que a conta e redefinida as 03:00.
- launchApp: { clearState: true }
- tapOn: "E-mail"
- inputText: "demo"
- tapOn: "Senha"
- inputText: "demo"
- tapOn: "Entrar"
- assertVisible: "Dashboard"
- tapOn: "Ajustes"
# B8: a linha existe (nao fica oculta), esta desabilitada e explica o motivo.
- assertVisible:
    text: "Trocar senha"
    enabled: false
- assertVisible: "Indisponível na conta de demonstração"
- assertVisible: ".*redefinida todos os dias às 03:00.*"
- tapOn: "Finanças"
- tapOn: "Selecionar"
- tapOn: "Cancelar"
# "Aluguel" existe todo mes no dataset de exemplo (sample-dataset.ts)
- assertVisible: "Aluguel"
- tapOn: "Excluir despesa: Aluguel"
- tapOn: "Excluir"
- assertVisible: "Despesa excluída."
- tapOn: "Desfazer"
- assertVisible: "Aluguel"
