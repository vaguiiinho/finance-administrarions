name: CI/CD Docker Hub

# Versão automática (SemVer) a partir das tags git `vX.Y.Z`:
#   - cada push na main incrementa o PATCH da última tag (1.0.4 -> 1.0.5);
#   - `[minor]` na mensagem do commit incrementa o MINOR (1.0.5 -> 1.1.0);
#   - `[major]` na mensagem do commit incrementa o MAJOR (1.1.0 -> 2.0.0);
#   - sem nenhuma tag ainda, começa em INITIAL_VERSION.
# As imagens recebem a tag da versão e `latest`; depois do push das imagens o workflow cria a tag git `vX.Y.Z`.
# As tags `mobile-v*` (mobile.yml) não entram na conta.

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write # criar a tag git da versão

# Dois pushes seguidos não podem calcular a mesma versão.
concurrency:
  group: deploy-images
  cancel-in-progress: false

env:
  REGISTRY_USER: vaguiiinho
  API_IMAGE_NAME: finance-api
  WEB_IMAGE_NAME: finance-web
  INITIAL_VERSION: 1.0.4

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # precisa das tags

      - name: Calcular próxima versão
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="$INITIAL_VERSION"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            if printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[major\]'; then
              major=$((major + 1)); minor=0; patch=0
            elif printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[minor\]'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "Última tag: ${last:-nenhuma} -> próxima versão: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # ==========================================
      # BUILD E PUSH DA API (NestJS)
      # ==========================================
      - name: Build and push API image (NestJS)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/${{ env.API_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY_USER }}/${{ env.API_IMAGE_NAME }}:latest
          build-args: |
            NODE_ENV=production

      # ==========================================
      # BUILD E PUSH DO WEB (NextJS)
      # ==========================================
      - name: Build and push Web image (NextJS)
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY_USER }}/${{ env.WEB_IMAGE_NAME }}:latest
          build-args: |
            NODE_ENV=production

      # Só depois das duas imagens publicadas: se o build falhar, a versão não é "gasta".
      - name: Criar tag git da versão
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

  # ==========================================
  # CD: deploy na VPS por SSH
  # ==========================================
  # Segredos (Settings > Secrets and variables > Actions > Secrets):
  #   VPS_HOST         IP ou domínio da VPS
  #   VPS_USER         usuário SSH (precisa rodar docker)
  #   VPS_SSH_KEY      chave PRIVADA de deploy (a pública vai no ~/.ssh/authorized_keys da VPS)
  #   VPS_KNOWN_HOSTS  saída de `ssh-keyscan -p <porta> <host>` (fixa a identidade da VPS; nada de StrictHostKeyChecking=no)
  # Variáveis (aba Variables): DEPLOY_ENABLED=true liga este job (deixe desligado até cadastrar os segredos);
  # opcionais: VPS_PORT (padrão 22), VPS_PATH (padrão /root/projects/finance).
  deploy:
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-and-push.outputs.version }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_PATH: ${{ vars.VPS_PATH || '/root/projects/finance' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/vps

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # O compose vai como .new: o deploy.sh valida antes de substituir (e guarda o anterior em .bak).
      - name: Enviar compose e script
        run: |
          ssh vps "mkdir -p '$VPS_PATH'"
          scp deploy/vps/docker-compose.yml "vps:$VPS_PATH/docker-compose.yml.new"
          scp deploy/vps/deploy.sh "vps:$VPS_PATH/deploy.sh"

      - name: Deploy ${{ env.VERSION }}
        run: ssh vps "bash '$VPS_PATH/deploy.sh' '$VERSION'"
